name: hitch-external-inference

services:
  engine:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.21}
    init: true
    restart: unless-stopped
    shm_size: 8gb
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        key="$$(cat /run/secrets/api_key)"
        test -n "$$key"
        exec python3 -m sglang.launch_server \
          --model-path /model --tokenizer-path /model \
          --served-model-name "$$WIRE_MODEL" \
          --host 0.0.0.0 --port 30000 --api-key "$$key" \
          --tp-size "$$TP_SIZE" --dtype bfloat16 \
          --context-length "$$CONTEXT_LENGTH" \
          --mem-fraction-static "$$MEM_FRACTION_STATIC" \
          --max-running-requests "$$ENGINE_MAX_RUNNING" \
          --max-queued-requests "$$ENGINE_MAX_QUEUED" \
          --tool-call-parser qwen25 --enable-metrics
    environment:
      WIRE_MODEL: ${WIRE_MODEL:?Set a versioned wire model name}
      TP_SIZE: "1"
      CONTEXT_LENGTH: ${CONTEXT_LENGTH:-8192}
      MEM_FRACTION_STATIC: ${MEM_FRACTION_STATIC:-0.80}
      ENGINE_MAX_RUNNING: ${ENGINE_MAX_RUNNING:-4}
      ENGINE_MAX_QUEUED: ${ENGINE_MAX_QUEUED:-8}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    secrets: [api_key]
    volumes:
      - type: bind
        source: ${HF_SNAPSHOT_DIR:?Set a self-contained immutable HF snapshot directory}
        target: /model
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${INFERENCE_PORT:-30000}:30000"
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS -H "Authorization: Bearer $$(cat /run/secrets/api_key)" http://127.0.0.1:30000/health >/dev/null']
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 60
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${INFERENCE_GPU_0:?Set the GPU UUID reserved for inference}"]
              capabilities: [gpu]
    networks: [model]

secrets:
  api_key:
    file: ${INFERENCE_API_KEY_FILE:?Set an absolute path to a private API key file}

networks:
  model:
    internal: true
