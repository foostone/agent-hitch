[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitch-inference"
version = "0.1.0"
description = "Standalone immutable inference pools and shared GPU resource ownership"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
sglang = ["sglang==0.5.15.post1"]

[project.scripts]
hitch-inference-node = "hitch_inference.node:main"
hitch-inference-runtime = "hitch_inference.http_server:main"

[tool.setuptools.packages.find]
where = ["python"]
